# CareerOS
#
#   cp .env.example .env
#   cp config/profile.example.yml config/profile.yml
#   cp config/letter.example.md   config/letter.md
#   docker compose up -d --build
#
#   dashboard  http://localhost:3000
#   API docs   http://localhost:8000/docs
#
# Five services. `migrate` runs to completion before `api` and `worker` start,
# so neither ever meets a half-migrated database and two API replicas cannot
# race each other into applying the same migration.

name: jobhunter

x-api-image: &api-image
  build:
    context: ./api
  image: jobhunter-api:latest

x-api-env: &api-env
  POSTGRES_HOST: db
  POSTGRES_USER: ${POSTGRES_USER:-jobhunter}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobhunter}
  POSTGRES_DB: ${POSTGRES_DB:-jobhunter}
  PROFILE_PATH: /app/config/profile.yml
  LETTER_PATH: /app/config/letter.md
  DRAFTS_DIR: /data/drafts
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_JSON: ${LOG_JSON:-true}
  ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
  ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobhunter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobhunter}
      POSTGRES_DB: ${POSTGRES_DB:-jobhunter}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Exposed for a local SQL client. Remove this line to keep the database
      # reachable only from inside the compose network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobhunter} -d ${POSTGRES_DB:-jobhunter}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Applies migrations, then exits. Everything else waits for it.
  migrate:
    <<: *api-image
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *api-env
    volumes:
      - ./config:/app/config:ro
    command: ["alembic", "upgrade", "head"]
    # The image's healthcheck probes the HTTP API, which this one-shot
    # container never serves.
    healthcheck:
      disable: true

  api:
    <<: *api-image
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *api-env
      # The API serves; the worker scans. The API has no scheduler at all, so
      # restarting it can never trigger an unscheduled crawl.
      CORS_ORIGINS: '["http://localhost:${WEB_PORT:-3000}","http://127.0.0.1:${WEB_PORT:-3000}"]'
    volumes:
      - ./config:/app/config:ro
      - ./data/drafts:/data/drafts
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"

  worker:
    <<: *api-image
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *api-env
      # Cadence and scan-on-startup come from the settings row, so they can be
      # changed in the Automation screen without a restart. Nothing here.
      WORKER_NAME: ${WORKER_NAME:-worker-1}
    volumes:
      - ./config:/app/config:ro
      - ./data/drafts:/data/drafts
    command: ["python", "-m", "app.worker"]
    # Safe to scale: every run takes a PostgreSQL advisory lock first, so a
    # second worker skips rather than ingesting the same sweep twice.
    #
    # The worker serves no HTTP, so the image's API healthcheck is replaced
    # with one that asks the real question: can it still reach the database?
    healthcheck:
      test: ["CMD", "python", "-c", "from app.db import wait_for_db; wait_for_db(attempts=2)"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3

  web:
    build:
      context: ./web
      args:
        # Inlined at build time, so this must be the URL the *browser* uses.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # Server components render inside this container, so they reach the API
      # by its service name. The browser uses NEXT_PUBLIC_API_URL above, which
      # is baked in at build time and must be a host-reachable address.
      API_INTERNAL_URL: http://api:8000
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"

volumes:
  pgdata:
