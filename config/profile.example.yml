# ---------------------------------------------------------------------------
# What counts as a job
# ---------------------------------------------------------------------------
roles:
  # Titles you consider your field. A posting whose title matches one of these
  # is treated as certainly relevant.
  #
  # This is no longer a gate. It used to be -- a posting needed one of these in
  # its title or it was discarded -- which threw away "Perception Engineer",
  # "Autonomy Engineer" and "Decision Scientist" every single scan. Relevance
  # now also reads the description (app/enrich/relevance.py), so adding a title
  # here widens what counts as certain rather than narrowing what survives.
  include:
    ["machine learning", "deep learning", "artificial intelligence",
     "ai engineer", "ai/ml", "ml engineer", "mlops", "ml platform",
     "ai platform", "data scientist", "data science", "research engineer",
     "research scientist", "applied scientist", "computer vision",
     "nlp", "natural language", "generative ai", "genai", "llm", "rag",
     "data engineer", "algorithm engineer", "algorithm developer",
     "simulation engineer", "perception engineer", "robotics engineer",
     "autonomous systems", "ki-ingenieur", "datenwissenschaftler",
     "machine-learning", "scientific computing", "ai backend",
     "ai software engineer", "python engineer", "analytics engineer",
     "ml infrastructure", "data infrastructure"]

  # Levels a recent graduate cannot realistically apply to. These are not
  # rejected outright -- §11 asks for a major score penalty and continued
  # searchability -- but they sink to the bottom.
  too_senior:
    ["senior", "sr.", "staff ", "principal", "lead ", "team lead", "teamlead",
     "head of", "director", "vp ", "vice president", "chief", "expert ",
     "architect", "professor", "postdoc", "post-doc", "fellow",
     "abteilungsleiter", "gruppenleiter", "referatsleiter"]

  # Not a full-time job. "graduate programme", "trainee" and "entry level"
  # are deliberately absent -- those are real jobs and exactly the target.
  not_fulltime:
    ["intern", "internship", "praktikum", "praktikant", "praktikantin",
     "werkstudent", "working student", "studentische", "student assistant",
     "hiwi", "thesis", "abschlussarbeit", "masterarbeit", "bachelorarbeit",
     "ausbildung", "apprentice", "azubi", "duales studium", "dual student",
     "volunteer", "ehrenamt", "part-time", "teilzeit", "minijob",
     "phd", "ph.d", "doctoral", "doktorand", "promotion", "placement",
     "industrial placement", "sandwich year", "gap year", "vie", "v.i.e",
     "co-op", "coop student", "summer programme", "scholarship", "stipendium",
     "fellowship", "bursary", "freelance", "contractor", "interim"]

  # Used to group the dashboard and to explain what kind of role a posting is.
  categories:
    "Machine Learning": ["machine learning", "ml engineer", "deep learning",
                         "applied scientist", "machine-learning"]
    "Computer Vision": ["computer vision", "perception", "image processing",
                        "visual recognition"]
    "NLP & LLM": ["nlp", "natural language", "llm", "large language model",
                  "rag", "generative ai", "genai", "conversational ai"]
    "MLOps & Platform": ["mlops", "ml platform", "ai platform",
                         "ml infrastructure", "model deployment"]
    "Data Science": ["data scientist", "data science", "analytics engineer",
                     "statistician"]
    "Data Engineering": ["data engineer", "data infrastructure", "etl",
                         "data pipeline"]
    "Research": ["research engineer", "research scientist", "scientific computing",
                 "scientific machine learning"]
    "Robotics & Autonomy": ["robotics", "autonomous systems", "autonomous driving",
                            "motion planning", "slam"]
    "Simulation": ["simulation engineer", "surrogate", "digital twin",
                   "physics-informed"]

# ---------------------------------------------------------------------------
# Skills, grouped. Groups are what let the matcher say "strong PyTorch and
# deep-learning match" instead of "11 keywords hit".
# ---------------------------------------------------------------------------
# What you have actually worked with. Claim only these.
#
# It is tempting to list every adjacent technology so more postings "match",
# and it makes the product worse: a TensorFlow role then looks like a literal
# hit instead of a transferable one, Kubernetes never appears as a gap, and
# every score drifts upward until none of them mean anything.
#
# Neighbouring technologies belong in app/enrich/equivalence.py, which awards
# partial credit and says out loud where it came from — "asks for TensorFlow;
# your PyTorch experience transfers". That is the honest version of the same
# generosity, and you can see it on the job.
skills:
  core_ml: [pytorch, scikit-learn, sklearn, "deep learning", "machine learning",
            "neural network", transformer, transformers, attention,
            "hugging face", cnn, convolutional]
  research: ["graph neural", "graph neural network", gnn, uncertainty,
             bayesian, conformal, "conformal prediction", calibration,
             "uncertainty quantification", probabilistic, "physics-informed",
             surrogate, "digital twin", "scientific computing", simulation]
  genai: [llm, rag, "retrieval-augmented", "retrieval augmented generation",
          embedding, embeddings, "vector database", "vector search", qdrant,
          "knowledge graph", neo4j, ollama, "fine-tuning", langchain,
          "prompt engineering", "semantic search"]
  vision: ["computer vision", opencv, "image segmentation", "object detection",
           "medical imaging", "grad-cam", ocr, "image processing"]
  backend: [fastapi, python, "rest api", sql, postgresql, redis, typescript,
            "next.js", api, backend, microservices]
  mlops: [docker, "ci/cd", mlflow, "weights & biases", kafka,
          "github actions", minio, mlops, "model deployment"]
  data: [pandas, numpy, "data pipeline", etl, "time series", "time-series",
         forecasting, "feature engineering", "data science"]

domains:
  [automotive, vehicle, car, mobility, autonomous, adas, aerospace, aviation,
   aircraft, airline, space, satellite, rocket, defence, defense, propulsion,
   turbine, medical, healthcare, imaging, radiology, pharma, clinical,
   simulation, traffic, transport, manufacturing, robotics, energy, battery,
   insurance, legal, finance, reinsurance, climate, semiconductor, telecom]

preferred_industries:
  [automotive, mobility, aerospace, aviation, technology, "industrial ai",
   robotics, "healthcare ai", "deep tech", research, "enterprise ai"]

# ---------------------------------------------------------------------------
# Scoring. Sub-scores are each 0-100; weights decide how much each contributes
# to the headline number. They must sum to 1.0.
# ---------------------------------------------------------------------------
scoring:
  weights:
    technical: 0.26
    location: 0.20
    freshness: 0.16
    experience: 0.15
    language: 0.13
    domain: 0.06
    education: 0.04

  # Added after the weighted sum, so a dream employer lifts a good match
  # rather than rescuing a bad one.
  tier_bonus:
    dream: 10
    high: 5
    normal: 0

  # Subtracted when the posting asks for a level well beyond a recent MSc.
  seniority_penalty:
    senior: 30
    lead: 45
    executive: 60

  # Subtracted from the total, on top of the language sub-score.
  #
  # A language requirement past your own is not a missing nice-to-have: it
  # decides whether an application can succeed at all. Language is 13% of the
  # weighted sum, so dropping that sub-score from 60 to 8 moved a total by
  # seven points and left roles demanding negotiation-level German sitting in
  # "Good Match". These say it properly.
  language_penalty:
    german_b2: 8
    german_c1_plus: 22
    german_native: 30

  # Freshness curve: (max age in days, sub-score). The first 48 hours matter
  # more than anything else, so it is steep rather than a polite bonus.
  freshness_curve: [[1, 100], [3, 92], [7, 75], [14, 45], [30, 15]]

# Warnings. These never reject a posting -- keyword detection is imperfect --
# but they subtract from the headline score so a role that cannot be taken does
# not outrank one that can.
flags:
  - code: EU-ONLY
    penalty: 20
    explain: May require EU citizenship or security clearance
    phrases: ["eu citizenship", "eu national", "security clearance",
              "citizenship required", "nationality requirement",
              "sicherheitsüberprüfung", "eu citizens only", "itar",
              "must be a citizen"]
  - code: NO-VISA
    penalty: 20
    explain: States that visa sponsorship is not available
    phrases: ["no sponsorship", "without sponsorship", "not sponsor",
              "must have the right to work", "existing work authorization",
              "keine visa", "cannot sponsor", "no visa support"]
  - code: CLEARANCE
    penalty: 15
    explain: Requires a security clearance
    phrases: ["security clearance", "sicherheitsüberprüfung", "nato clearance",
              "geheimschutz"]

# ---------------------------------------------------------------------------
# Employers.
#
# Two kinds, and the difference is the whole point of this file.
#
# An entry with `adapter:` is read automatically. Every one of them was probed
# against its real endpoint before being written here -- see
# `python -m app.tools.verify_sources`. Most companies publish their jobs
# through one of a handful of applicant-tracking systems, so the adapter is per
# platform and adding an employer is one line rather than a new scraper.
#
# An entry with `careers_url:` and no adapter cannot be read. Its careers site
# has no open feed, or refuses automated clients, and CareerOS says so and
# gives you the link. That is worth more than a row claiming to be monitored
# while fetching nothing.
#
# Guessing an adapter argument is how the second kind silently becomes a lie:
# of 279 plausible-looking candidates probed for this file, 102 did not exist.
# Verify before adding.
#
#   automated: 117
#   manual watchlist: 138
#
# `parent:` records group ownership (Volkswagen Group -> Audi, Porsche) so the
# interface can group them; the vacancy always keeps the legal employer that
# posted it. `aliases:` are other names the same employer posts under, used to
# match a board result back to a known company.
# ---------------------------------------------------------------------------
