         lausanne, zug, lucerne, luzern, winterthur, baden, aargau]
    at: [austria, österreich, vienna, wien, graz, linz, salzburg, innsbruck]
    nl: [netherlands, amsterdam, eindhoven, delft, rotterdam, utrecht,
         the hague, den haag]
    eu: [france, paris, italy, milan, spain, madrid, barcelona, portugal,
         lisbon, poland, warsaw, czech, prague, denmark, copenhagen, sweden,
         stockholm, belgium, brussels, ireland, dublin, luxembourg, finland,
