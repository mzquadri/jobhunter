# ---------------------------------------------------------------------------
# CareerOS settings seed
#
# Copy to config/profile.yml and make it yours. That file is gitignored, so
# your name, contact details and search history never reach the repository.
#
# This file is a SEED. It is read once, on the first boot of an empty
# database, and never again — from then on the settings live in the database
# and are edited in the Settings screen, which is what a scan reads. Editing
# this file afterwards changes nothing until you press "Restore defaults".
#
# Everything discovery and ranking do is driven from these values. Adding an
# employer is one line; there is no code to change.
# ---------------------------------------------------------------------------

candidate:
  name: Your Name
  email: you@example.com
  phone: "+49 000 0000000"
  city: Munich, Germany
  primary_city: Munich
  available_from: immediately
  # msc | bsc | phd — compared against what a posting asks for.
  education_level: msc
  # Your German, in CEFR terms. Drives the language sub-score.
  german_level: a2
  # Including working-student and internship time. Used for the experience
  # sub-score, not as a hard filter.
  years_experience: 1.5

search:
  # Postings older than this never reach the dashboard. On engineering roles
  # the applications that land in the first days are the ones that get read.
  max_age_days: 14
  # A job no longer found by any source is archived rather than deleted, so
  # reposting patterns stay visible.
  archive_after_days: 30
  # Three thresholds, and they are deliberately different numbers.
  #
  # min_score decides what is *stored*. It stays low: re-scoring happens every
  # scan, and settings change, so a 43 today can be a 67 after you add a skill
  # or widen a location tier. Throwing it away to keep the interface tidy would
  # destroy data that cannot be recovered without re-fetching the whole market.
  min_score: 25
  # recommend_min_score decides what is *shown by default* — the dashboard,
  # the explorer's opening view, the "Worth Applying" list. 60, because a role
  # where you meet roughly 60% of what was described is worth an application.
  # Recruiters describe an ideal candidate, not a minimum.
  recommend_min_score: 60
  # high_match_score is the "drop everything and read this" line.
  high_match_score: 80
  draft_min_score: 60
  keep_undated: true
  # A preference, never a filter: a role with no stated salary is still shown.
  target_salary_eur: 70000

# ---------------------------------------------------------------------------
# Geography. Weighted heavily on purpose: a perfect role in the wrong country
# is worth nothing, and without this the scorer will happily rank one first.
# ---------------------------------------------------------------------------
