[alembic]
script_location = alembic
prepend_sys_path = .
# Timestamped, readable revision filenames instead of opaque hashes.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
timezone = UTC
# sqlalchemy.url is set at runtime in env.py from the environment, so no
# credentials are ever written into this file.

[post_write_hooks]
# Invoked as a module rather than a console script, so generation works
# wherever ruff is importable even if its entry point is not on PATH.
hooks = ruff
ruff.type = exec
ruff.executable = python
ruff.options = -m ruff format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
