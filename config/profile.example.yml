# Search terms for the employer platforms that take one (Workday, jobs.ch).
#
# Kept to families rather than exact titles: these are server-side searches, so
# every extra term is another request to someone else's system, and the title
# filtering afterwards is the part that does the precision work. Five terms
# that each match broadly beat thirty that each match one phrasing.
company_queries:
  ["machine learning", "artificial intelligence", "data scientist",
   "deep learning", "data engineer", "computer vision", "algorithm",
   "research engineer", "simulation", "analytics"]

# ---------------------------------------------------------------------------
# Company-independent boards
# ---------------------------------------------------------------------------
boards:
  enabled: [arbeitnow, jobsch]
  arbeitnow_pages: 4        # 250 postings per page, newest first
  # Board searches. Wider than the employer-platform list because this is the
  # discovery layer: an employer nobody configured only ever reaches CareerOS
  # through one of these, and a term that is never searched is a company that
  # is never found.
  queries:
    ["machine learning engineer", "ai engineer", "data scientist",
     "deep learning", "mlops engineer", "computer vision engineer",
     "research engineer", "llm engineer", "applied scientist",
     "data engineer", "algorithm engineer", "perception engineer",
     "nlp engineer", "generative ai", "ml platform engineer",
     "analytics engineer", "simulation engineer", "robotics engineer",
     "autonomous driving", "forecasting", "optimization engineer",
     "decision scientist", "ai software engineer"]
  adzuna_countries: [de, ch, at, nl]

# LinkedIn and Indeed are deliberately absent: both block automated access,
# and LinkedIn automation risks a permanent account ban.

# ---------------------------------------------------------------------------
# Saved searches, seeded on first boot. Yours are never overwritten.
# ---------------------------------------------------------------------------
saved_searches:
  - {name: "Munich AI", description: "Anything AI/ML in and around Munich",
     query: {country: de, q: munich, sort: newest}, pinned: true}
  - {name: "Germany ML", description: "Machine learning across Germany",
     query: {country: de, sort: score}, pinned: true}
  - {name: "Switzerland", description: "Swiss roles, strongest first",
     query: {country: ch, sort: score}}
  - {name: "Dream employers", description: "Only the shortlist",
     query: {tier: dream, sort: newest}, pinned: true}
  - {name: "English only", description: "No German requirement at all",
     query: {language: english_only, sort: score}}
  - {name: "Aerospace", description: "Aerospace and aviation",
     query: {domain: aerospace, sort: newest}}
  - {name: "Automotive AI", description: "Automotive and autonomous systems",
     query: {domain: automotive, sort: newest}}
  - {name: "LLM and RAG", description: "Generative AI and retrieval",
     query: {category: "NLP & LLM", sort: newest}}
  - {name: "Computer Vision", description: "Perception and imaging",
     query: {category: "Computer Vision", sort: newest}}
  - {name: "Research Engineer", description: "Research-leaning engineering",
     query: {category: Research, sort: score}}
  - {name: "Posted this week", description: "Everything from the last seven days",
     query: {max_age_days: 7, sort: newest}}
  - {name: "Strong matches", description: "Score 70 and above",
     query: {min_score: 70, sort: score}, pinned: true}
