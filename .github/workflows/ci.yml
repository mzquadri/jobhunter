name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: Privacy and secret audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so a secret committed earlier and removed later is
          # still visible to the scan.
          fetch-depth: 0
      - name: Audit
        run: bash scripts/audit.sh

  api:
    name: API — lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        # The suite runs against config/profile.example.yml, so a broken
        # example is caught here rather than by the next person to clone.
        env:
          PROFILE_PATH: ${{ github.workspace }}/config/profile.example.yml
          LETTER_PATH: ${{ github.workspace }}/config/letter.example.md
        run: pytest -q

  web:
    name: Dashboard — typecheck, lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Dashboard image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  stack:
    name: Stack starts and serves
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4

      - name: Prepare config
        run: |
          cp .env.example .env
          cp config/profile.example.yml config/profile.yml
          cp config/letter.example.md config/letter.md
          # Leave discovery off: CI must not reach out to real employers.
          echo "SWEEP_ON_STARTUP=false" >> .env
          echo "SWEEP_INTERVAL_MINUTES=0" >> .env

      - name: Start
        run: docker compose up -d --build db migrate api

      - name: Wait for the API
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8000/api/health > /dev/null; then
              echo "api is up"; exit 0
            fi
            sleep 3
          done
          echo "api never became healthy"; docker compose logs; exit 1

      - name: Smoke-test the endpoints
        run: |
          set -e
          curl -fsS http://localhost:8000/api/health   | tee /dev/stderr | grep -q '"status":"ok"'
          curl -fsS http://localhost:8000/api/jobs     > /dev/null
          curl -fsS http://localhost:8000/api/stats    > /dev/null
          curl -fsS http://localhost:8000/api/companies > /dev/null
          curl -fsS http://localhost:8000/openapi.json > /dev/null
          echo "all endpoints answered"

      - name: Logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop
        if: always()
        run: docker compose down -v
