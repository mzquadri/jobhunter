# ---------------------------------------------------------------------------
# CareerOS settings seed
#
# Copy to config/profile.yml and make it yours. That file is gitignored, so
# your name, contact details and search history never reach the repository.
#
# This file is a SEED. It is read once, on the first boot of an empty
# database, and never again — from then on the settings live in the database
# and are edited in the Settings screen, which is what a scan reads. Editing
# this file afterwards changes nothing until you press "Restore defaults".
#
# Everything discovery and ranking do is driven from these values. Adding an
# employer is one line; there is no code to change.
# ---------------------------------------------------------------------------

candidate:
  name: Your Name
  email: you@example.com
  phone: "+49 000 0000000"
  city: Munich, Germany
  primary_city: Munich
  available_from: immediately
  # msc | bsc | phd — compared against what a posting asks for.
  education_level: msc
  # Your German, in CEFR terms. Drives the language sub-score.
  german_level: a2
  # Including working-student and internship time. Used for the experience
  # sub-score, not as a hard filter.
  years_experience: 1.5

search:
  # Postings older than this never reach the dashboard. On engineering roles
  # the applications that land in the first days are the ones that get read.
  max_age_days: 14
  # A job no longer found by any source is archived rather than deleted, so
  # reposting patterns stay visible.
  archive_after_days: 30
  min_score: 25
  draft_min_score: 60
  keep_undated: true
  # A preference, never a filter: a role with no stated salary is still shown.
  target_salary_eur: 70000

# ---------------------------------------------------------------------------
# Geography. Weighted heavily on purpose: a perfect role in the wrong country
# is worth nothing, and without this the scorer will happily rank one first.
# ---------------------------------------------------------------------------
locations:
  tiers:
    24: [munich, münchen, muenchen, garching, ingolstadt, bavaria, bayern]
    20: [germany, deutschland, deu, berlin, hamburg, stuttgart, frankfurt,
         cologne, köln, koeln, düsseldorf, duesseldorf, dresden, leipzig,
         nuremberg, nürnberg, nuernberg, karlsruhe, aachen, bremen, hannover,
         ulm, bonn, essen, dortmund, mannheim, friedrichshafen, erlangen,
         regensburg, wolfsburg, darmstadt, heidelberg, augsburg]
    17: [switzerland, schweiz, zurich, zürich, basel, bern, geneva, genf,
         lausanne, zug, lucerne, luzern, winterthur, che]
    15: [austria, österreich, oesterreich, vienna, wien, graz, linz, salzburg,
         innsbruck]
    13: [netherlands, amsterdam, eindhoven, delft, rotterdam, utrecht,
         the hague, den haag]
    10: [denmark, copenhagen, sweden, stockholm, gothenburg, luxembourg,
         ireland, dublin, belgium, brussels, leuven, helsinki, finland]
    7:  [france, paris, toulouse, grenoble, italy, milan, milano, turin,
         torino, modena, bologna, maranello, spain, madrid, barcelona,
         norway, oslo, prague, czech, poland, warsaw, krakow, portugal, lisbon]
    4:  [united kingdom, london, cambridge, oxford, bristol, dubai, abu dhabi,
         uae, united arab emirates, doha, qatar]

  # Hard reject. A posting clearly in one of these is dropped; it is not a job
  # that can be taken. A posting with no location at all is kept.
  exclude:
    [india, bangalore, bengaluru, hyderabad, pune, chennai, mumbai, gurgaon,
     gurugram, noida, new delhi, kolkata, ahmedabad, coimbatore,
     united states, usa, san jose, sunnyvale, san francisco, new york,
     washington, california, texas, seattle, boston, chicago, atlanta, detroit,
     austin, denver, michigan, ohio, north carolina, new jersey, pennsylvania,
     florida, arizona, oregon, utah, georgia,
     china, shanghai, beijing, shenzhen, suzhou, chengdu, wuhan,
     japan, tokyo, osaka, yokohama,
     singapore, malaysia, kuala lumpur, thailand, bangkok, vietnam, hanoi,
     philippines, manila, indonesia, jakarta,
     brazil, sao paulo, mexico, guadalajara, costa rica, argentina, chile,
     colombia, bogota, peru,
     australia, sydney, melbourne, new zealand, auckland,
     canada, toronto, vancouver, montreal, ottawa,
     south africa, johannesburg, egypt, cairo, morocco, casablanca,
     turkey, istanbul, israel, tel aviv,
     south korea, seoul, taiwan, taipei, hong kong, russia, moscow]

  # Country filters in the dashboard resolve through this map.
  countries:
    de: [germany, deutschland, deu, munich, münchen, berlin, hamburg, stuttgart,
         frankfurt, cologne, köln, düsseldorf, dresden, leipzig, nuremberg,
