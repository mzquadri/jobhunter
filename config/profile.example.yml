#
#   adapter: workday | smartrecruiters | successfactors | greenhouse | lever
#            | ashby | personio | workable
#   tier:    dream | high | normal | ignored
#
# Leave `adapter` out entirely for an employer with no machine-readable
# endpoint. It still appears in the dashboard as a one-click link -- saying
# "this one cannot be automated" beats omitting the employer silently.
#
# Which adapter an employer uses is visible in its careers URL:
#   *.myworkdayjobs.com          -> workday,         arg "tenant|wdN|SiteName"
#   *.smartrecruiters.com        -> smartrecruiters, arg company slug
#   jobs.<company>.com           -> successfactors,  arg that hostname
