<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1248 546" role="img" aria-label="Rank rather than filter, and name every deduction">
<title>Rank rather than filter, and name every deduction</title>
<style>
    :root{--bg:#f7f8fa;--ink:#1c2430;--soft:#5a6675;--line:#c9d1da;--box:#ffffff;--a:#4e9a92}
    @media(prefers-color-scheme:dark){:root{--bg:#10151c;--ink:#e6ebf2;--soft:#9fb0c2;--line:#3a4654;--box:#18202a;--a:#82c0b8}}
    text{font-family:Archivo,'Segoe UI',Arial,sans-serif}
    .t{fill:var(--ink);font-size:13px;font-weight:600}.n{fill:var(--soft);font-size:10.5px}.l{fill:var(--soft);font-size:10px}
    rect.b{fill:var(--box);stroke:var(--line);stroke-width:1.2}
    .e{fill:none;stroke:var(--a);stroke-width:1.6;stroke-dasharray:100;stroke-dashoffset:100}
    .e.f{stroke:var(--soft)}
    .g{opacity:0;transform-box:fill-box;transform-origin:center}
    .p{fill:var(--a);opacity:0}
    @keyframes draw{0%{stroke-dashoffset:100}35%,88%{stroke-dashoffset:0}100%{stroke-dashoffset:100}}
    @keyframes rise{0%{opacity:0;transform:scale(.9)}14%,90%{opacity:1;transform:none}100%{opacity:0}}
    @keyframes run{0%{offset-distance:0;opacity:0}5%{opacity:1}30%{opacity:1}36%,100%{offset-distance:100%;opacity:0}}
    @keyframes lit{0%,100%{stroke:var(--line);stroke-width:1.2}50%{stroke:var(--a);stroke-width:2.6}}
    .e{animation:draw 9s ease-in-out infinite both;animation-delay:calc(var(--i)*.14s)}
    .g{animation:rise 9s ease-out infinite both;animation-delay:calc(var(--i)*.14s)}
    .g rect.b{animation:lit 2.2s ease-in-out 1 both;animation-iteration-count:infinite;animation-delay:calc(var(--i)*.35s)}
    .p{animation:run 9s linear infinite both;animation-delay:calc(1s + var(--i)*.14s)}
    @media(prefers-reduced-motion:reduce){.e,.g,.g rect.b{animation:none;opacity:1;stroke-dashoffset:0}.p{display:none}}
    </style>
<defs><marker id="a" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7Z" fill="var(--a)"/></marker></defs>
<rect width="100%" height="100%" rx="10" fill="var(--bg)"/>
<g transform="translate(0 30)">
<text class="t" x="26" y="-8" style="font-size:15px">Rank rather than filter, and name every deduction</text>
<path class="e" d="M 214 177 L 278 177" pathLength="100" marker-end="url(#a)" style="--i:0"/>
<circle class="p" r="4" style="--i:0;offset-path:path('M 214 177 L 278 177')"/>
<path class="e" d="M 372 216 L 372 362" pathLength="100" marker-end="url(#a)" style="--i:1"/>
<circle class="p" r="4" style="--i:1;offset-path:path('M 372 216 L 372 362')"/>
<text class="l" x="380" y="289" text-anchor="start">not an opportunity</text>
<path class="e" d="M 466 177 L 498 177 L 498 65 L 530 65" pathLength="100" marker-end="url(#a)" style="--i:2"/>
<circle class="p" r="4" style="--i:2;offset-path:path('M 466 177 L 498 177 L 498 65 L 530 65')"/>
<text class="l" x="482" y="168" text-anchor="middle">kept</text>
<path class="e" d="M 624 104 L 624 138" pathLength="100" marker-end="url(#a)" style="--i:3"/>
<circle class="p" r="4" style="--i:3;offset-path:path('M 624 104 L 624 138')"/>
<path class="e" d="M 718 177 L 782 177" pathLength="100" marker-end="url(#a)" style="--i:4"/>
<circle class="p" r="4" style="--i:4;offset-path:path('M 718 177 L 782 177')"/>
<path class="e" d="M 970 177 L 1034 177" pathLength="100" marker-end="url(#a)" style="--i:5"/>
<circle class="p" r="4" style="--i:5;offset-path:path('M 970 177 L 1034 177')"/>
<path class="e f" d="M 876 216 L 876 474 L 624 474 L 624 216" pathLength="100" marker-end="url(#a)" style="--i:6"/>
<circle class="p" r="4" style="--i:6;offset-path:path('M 876 216 L 876 474 L 624 474 L 624 216')"/>
<text class="l" x="750" y="465" text-anchor="middle">longer than the terms beside them</text>
<g class="g" style="--i:0"><rect class="b" x="26" y="138" width="188" height="78" rx="6"/><text class="t" x="40" y="164">Nine adapters</text>
<text class="n" x="40" y="184">One per applicant-tracking</text>
<text class="n" x="40" y="197">system, read directly rather…</text>
</g>
<g class="g" style="--i:1"><rect class="b" x="278" y="138" width="188" height="78" rx="6"/><text class="t" x="292" y="164">Discard, narrowly</text>
<text class="n" x="292" y="184">Only where the opportunity</text>
<text class="n" x="292" y="197">does not exist, or is not this…</text>
</g>
<g class="g" style="--i:2"><rect class="b" x="278" y="362" width="188" height="78" rx="6"/><text class="t" x="292" y="388">Not a posting</text>
<text class="n" x="292" y="408">The only thing removed</text>
<text class="n" x="292" y="421">outright rather than ranked…</text>
</g>
<g class="g" style="--i:3"><rect class="b" x="530" y="26" width="188" height="78" rx="6"/><text class="t" x="544" y="52">Postings</text>
<text class="n" x="544" y="72">Kept with their enrichment, so</text>
<text class="n" x="544" y="85">a score can be recomputed.</text>
</g>
<g class="g" style="--i:4"><rect class="b" x="530" y="138" width="188" height="78" rx="6"/><text class="t" x="544" y="164">Weighted sum</text>
<text class="n" x="544" y="184">Seven components, with the</text>
<text class="n" x="544" y="197">weights held in configuration.</text>
</g>
<g class="g" style="--i:5"><rect class="b" x="782" y="138" width="188" height="78" rx="6"/><text class="t" x="796" y="164">Flat penalties</text>
<text class="n" x="796" y="184">For the two requirements no</text>
<text class="n" x="796" y="197">weight can express as a matter…</text>
</g>
<g class="g" style="--i:6"><rect class="b" x="1034" y="138" width="188" height="78" rx="6"/><text class="t" x="1048" y="164">Shown with its reasons</text>
<text class="n" x="1048" y="184">Every deduction named on the</text>
<text class="n" x="1048" y="197">job rather than used to remove…</text>
</g>
</g></svg>